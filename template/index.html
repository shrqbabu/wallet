<h2>User List</h2>

<form action="/add" method="POST">

<input type="text" name="name" placeholder="Name">
<input type="email" name="email" placeholder="Email">

<button>Add</button>

</form>

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Action</th>
</tr>

{% for user in users %}

<tr>

<td>{{ user[0] }}</td>
<td>{{ user[1] }}</td>
<td>{{ user[2] }}</td>

<td>
<a href="/delete/{{ user[0] }}">Delete</a>
</td>

</tr>

{% endfor %}

</table>
